<style>
  :root {
    /* daytime print — aged travel-poster stock */
    --paper:      #F1E7D0;
    --paper-deep: #E7DABB;
    --ink:        #123B3B;
    --ink-soft:   #4A5A50;
    --sun:        #EBA53B;
    --coral:      #D8703E;
    --line:       rgba(18, 59, 59, 0.22);
    --sky-a:      #F5ECD8;
    --sky-b:      #EAD9B4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* the night-departure poster */
      --paper:      #101B2E;
      --paper-deep: #0B1422;
      --ink:        #F3E9D2;
      --ink-soft:   #A9B4C4;
      --sun:        #F2BE55;
      --coral:      #E4834B;
      --line:       rgba(243, 233, 210, 0.18);
      --sky-a:      #16233A;
      --sky-b:      #0C1526;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    /* faint printed paper grain */
    background-image:
      radial-gradient(circle at 20% 12%, rgba(0,0,0,0.03), transparent 55%),
      radial-gradient(circle at 82% 88%, rgba(0,0,0,0.04), transparent 55%);
  }

  .poster {
    width: 100%;
    max-width: 620px;
    min-height: 100vh;
    padding: clamp(2.4rem, 6vw, 4rem) clamp(1.6rem, 6vw, 3.2rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
  }
  /* printed border rule of the poster */
  .poster::before {
    content: "";
    position: absolute;
    inset: clamp(1rem, 3vw, 1.6rem);
    border: 1.5px solid var(--line);
    pointer-events: none;
  }

  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
    padding-left: 0.42em;
    margin-bottom: clamp(2.2rem, 8vw, 3.6rem);
  }

  /* ---- sunburst emblem ---- */
  .emblem {
    position: relative;
    width: clamp(150px, 42vw, 210px);
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    margin-bottom: clamp(1.8rem, 5vw, 2.6rem);
  }
  .rays {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-conic-gradient(
      var(--sun) 0deg 7deg,
      transparent 7deg 14deg
    );
    -webkit-mask: radial-gradient(circle, transparent 30%, #000 32%, #000 68%, transparent 72%);
            mask: radial-gradient(circle, transparent 30%, #000 32%, #000 68%, transparent 72%);
    opacity: 0.9;
    animation: spin 90s linear infinite;
  }
  .sun {
    position: relative;
    width: 46%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, var(--sun), var(--coral));
    box-shadow: 0 0 0 6px var(--paper), 0 0 34px -6px var(--coral);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .rays { animation: none; }
  }

  .wordmark {
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    line-height: 0.98;
    font-size: clamp(2.5rem, 12vw, 4.4rem);
    margin: 0;
    padding-left: 0.2em;
    text-wrap: balance;
  }
  .wordmark .now { color: var(--coral); }

  .tagline {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: clamp(1.02rem, 3.4vw, 1.24rem);
    color: var(--ink-soft);
    margin: 1.1rem 0 0;
    max-width: 30ch;
    line-height: 1.5;
  }

  .rule {
    width: 100%;
    max-width: 340px;
    display: flex;
    align-items: center;
    gap: 0.9rem;
    margin: clamp(2.4rem, 7vw, 3.4rem) 0 clamp(1.4rem, 4vw, 2rem);
    color: var(--ink-soft);
  }
  .rule::before, .rule::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }
  .rule span {
    font-size: 0.66rem;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* ---- departure-board links ---- */
  .links {
    width: 100%;
    max-width: 380px;
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .links li { border-top: 1px solid var(--line); }
  .links li:last-child { border-bottom: 1px solid var(--line); }

  .links a {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.02rem 0.4rem;
    text-decoration: none;
    color: var(--ink);
    position: relative;
    overflow: hidden;
  }
  .links a::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%;
    height: 100%;
    background: var(--sun);
    transform: translateX(-101%);
    transition: transform 0.42s cubic-bezier(.22,.61,.36,1);
    z-index: 0;
    opacity: 0.16;
  }
  .links a:hover::after,
  .links a:focus-visible::after { transform: translateX(0); }
  .links a:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }

  .links .label {
    position: relative;
    z-index: 1;
    font-size: 0.74rem;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .links .handle {
    position: relative;
    z-index: 1;
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 0.98rem;
    color: var(--ink-soft);
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
  }
  .links .arrow {
    font-style: normal;
    font-family: "Helvetica Neue", Arial, sans-serif;
    transition: transform 0.3s ease;
  }
  .links a:hover .arrow { transform: translateX(4px); }
  .links a:hover .handle { color: var(--ink); }

  .imprint {
    margin-top: auto;
    padding-top: clamp(2.4rem, 7vw, 3.4rem);
    font-size: 0.64rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .imprint .dot { color: var(--coral); margin: 0 0.5em; }

  .studio {
    margin-top: 0.9rem;
    font-size: 0.6rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .studio a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    padding-bottom: 1px;
    transition: color 0.3s ease, border-color 0.3s ease;
  }
  .studio a:hover { color: var(--coral); border-color: var(--coral); }
  .studio a:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
</style>
<style>
  /* Pocket Guides (the-trip-now-www#35) */
  .guides { list-style:none; margin:0; padding:0; display:grid; gap:1.1rem; }
  .guide { border:1px solid var(--line); border-radius:14px; padding:1.1rem 1.2rem; background:var(--paper-deep); }
  .guide .gtitle { font-size:1.25rem; font-weight:700; margin:0 0 .25rem; }
  .guide .gplace { color:var(--ink-soft); font-size:.9rem; margin:0 0 .6rem; letter-spacing:.04em; text-transform:uppercase; }
  .guide .gpitch { margin:0 0 .8rem; line-height:1.5; }
  .guide .gformats { display:flex; flex-wrap:wrap; gap:.5rem; margin:0; padding:0; list-style:none; }
  .guide .gformats a { display:inline-block; border:1px solid var(--ink); border-radius:999px; padding:.35rem .8rem; color:var(--ink); text-decoration:none; font-size:.92rem; }
  .guide .gformats a:hover, .guide .gformats a:focus-visible { background:var(--sun); outline:none; }
  .guide.soon { opacity:.75; }
  .guide .badge { display:inline-block; font-size:.75rem; letter-spacing:.06em; text-transform:uppercase; border:1px dashed var(--ink-soft); border-radius:6px; padding:.15rem .45rem; color:var(--ink-soft); }
  .seeall { margin:.9rem 0 0; text-align:right; }
  .seeall a { color:var(--coral); font-weight:700; text-decoration:none; }
  /* Featured products (the-trip-now-www#12) */
  .featured { list-style:none; margin:0; padding:0; width:100%; display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:.9rem; text-align:left; }
  @media (min-width: 560px) { .featured { grid-template-columns:repeat(4, minmax(0, 1fr)); } }
  .product a { display:flex; flex-direction:column; gap:.3rem; height:100%; border:1px solid var(--line); border-radius:14px; padding:.55rem; background:var(--paper-deep); color:var(--ink); text-decoration:none; transition:transform .15s ease; }
  .product a:hover { transform:translateY(-2px); border-color:var(--ink); }
  .product a:focus-visible { outline:2px solid var(--coral); outline-offset:2px; }
  .product img { width:100%; height:auto; aspect-ratio:1 / 1; object-fit:cover; border-radius:10px; background:#fff; }
  .product .pname { font-weight:700; font-size:.95rem; line-height:1.25; }
  .product .pmeta { color:var(--ink-soft); font-size:.82rem; }
  @media (prefers-reduced-motion: reduce) { .product a { transition:none; } .product a:hover { transform:none; } }
</style>
